# Render Blueprint: Render Dashboard -> New -> Blueprint -> pick this repo.
# Secrets marked sync:false are asked for once in the dashboard (never commit them).
services:
  - type: web
    name: skillquiz-api
    runtime: docker
    # No rootDir: both paths below are from the repo root.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_MODELS
        value: gemini-3.1-flash-lite,gemini-3.6-flash
      - key: GEMINI_DAILY_LIMITS
        value: gemini-3.1-flash-lite:500,gemini-3.6-flash:20
      - key: QUIZ_QUESTIONS_PER_TEST
        value: "20"
      - key: QUIZ_TIME_LIMIT_MINUTES
        value: "30"
