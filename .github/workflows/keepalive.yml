# Supabase free projects pause after ~7 days without activity.
# This pings the backend every 3 days; /api/health runs a DB query, which counts as activity.
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables -> New variable
#        BACKEND_URL = https://skillquiz-api.onrender.com   (your Render URL, no trailing slash)
name: Keep database awake

on:
  schedule:
    - cron: "17 3 */3 * *"   # every 3 days, 08:47 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (Render may take ~1 min to wake up)
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then echo "Set BACKEND_URL repo variable first"; exit 1; fi
          for i in 1 2 3 4; do
            if curl -fsS --max-time 90 "${{ vars.BACKEND_URL }}/api/health"; then echo; echo "OK"; exit 0; fi
            echo "retry $i"; sleep 20
          done
          exit 1
