# ============================================================
#  SkillQuiz - all values can be overridden by environment
#  variables on Render (Dashboard -> your service -> Environment)
# ============================================================
spring.application.name=skillquiz
server.port=${PORT:8080}

# ---------- Database (Supabase Postgres) ----------
# Use the "Session pooler" connection details from Supabase (works on IPv4, which Render needs)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# free tiers allow few connections - keep the pool small
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# creates/updates tables automatically - fine for this app size
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- AI (Google Gemini, free key from https://aistudio.google.com/apikey) ----------
gemini.api-key=${GEMINI_API_KEY:}
# Tried in order. Free daily quota is PER MODEL (flash-lite ~500/day, flash ~20/day), so a chain = more capacity.
gemini.models=${GEMINI_MODELS:gemini-3.1-flash-lite,gemini-3.6-flash}
# Free requests per day per model (Google doesn't expose this via API; used for the usage meter)
gemini.daily-limits=${GEMINI_DAILY_LIMITS:gemini-3.1-flash-lite:500,gemini-3.6-flash:20}

# ---------- Quiz rules ----------
quiz.questions-per-test=${QUIZ_QUESTIONS_PER_TEST:20}
quiz.time-limit-minutes=${QUIZ_TIME_LIMIT_MINUTES:30}
quiz.min-pool-size=${QUIZ_MIN_POOL_SIZE:30}
quiz.target-pool-size=${QUIZ_TARGET_POOL_SIZE:90}
quiz.max-pool-size=${QUIZ_MAX_POOL_SIZE:250}
quiz.batch-size=${QUIZ_BATCH_SIZE:30}
quiz.max-generations-per-minute=${QUIZ_MAX_AI_CALLS_PER_MINUTE:6}
quiz.admin-key=${ADMIN_KEY:}
# your GitHub Pages URL, e.g. https://amitghorpade.github.io  (comma separate for more)
quiz.allowed-origins=${ALLOWED_ORIGINS:*}
quiz.demo-mode=${QUIZ_DEMO_MODE:false}

# background top-up threads
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=2

logging.level.com.swami=INFO
