# Run on your laptop without Supabase/AI:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
# Uses an in-memory H2 DB and demo questions. Then open docs/index.html in the browser.
spring.datasource.url=jdbc:h2:mem:skillquiz;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
quiz.demo-mode=${QUIZ_DEMO_MODE:true}
quiz.admin-key=${ADMIN_KEY:admin123}
